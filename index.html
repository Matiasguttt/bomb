<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <a-camera>
            <a-cursor fuse="true" fuse-timeout="1000"></a-cursor>
        </a-camera>
        <a-plane rotation="-90 0 0" width="20" height="20" color="grey"></a-plane>
        
        <a-box id="one" position="0 1 -5" color="limegreen" width="0.5" height="0.5" depth="0.5" animation__click="property: scale; from: 1 1 1; to: 0 0 0; loop: false; dur: 1000; startEvents: click;"></a-box>
        <a-box id="two" position="0 1 -5" color="limegreen" width="0.5" height="0.5" depth="0.5" animation__click="property: scale; from: 1 1 1; to: 0 0 0; loop: false; dur: 1000; startEvents: click;"></a-box>
        <a-box id="three" position="0 1 -5" color="limegreen" width="0.5" height="0.5" depth="0.5" animation__click="property: scale; from: 1 1 1; to: 0 0 0; loop: false; dur: 1000; startEvents: click;"></a-box>
        <a-box id="four" position="2 1 -5" color="limegreen" width="0.5" height="0.5" depth="0.5" animation__click="property: scale; from: 1 1 1; to: 0 0 0; loop: false; dur: 1000; startEvents: click;"></a-box>
        <a-box id="five" position="-2 1 -5" color="limegreen" width="0.5" height="0.5" depth="0.5" animation__click="property: scale; from: 1 1 1; to: 0 0 0; loop: false; dur: 1000; startEvents: click;"></a-box>
        <a-box id="six" position="0 3 -5" color="limegreen" width="0.5" height="0.5" depth="0.5" animation__click="property: scale; from: 1 1 1; to: 0 0 0; loop: false; dur: 1000; startEvents: click;"></a-box>
        <a-sphere id="sevendot" position="0 1 -3" color="green" radius="0.5" animation__click="property: scale; from: 1 1 1; to: 200 200 5; loop: false; dur: 1000; startEvents: click;"></a-sphere>
    </a-scene>

    <script>
        const scene = document.querySelector('a-scene');
        const rand = (min, max) => min + Math.random() * (max - min);

        function animateToRandomPositions(selector) {
            const el = document.querySelector(selector);
            if (!el) return;

            function moveToRandom() {
                el.setAttribute('animation__move', {
                    property: 'position',
                 
                    to: `${rand(-4, 4)} ${rand(0.5, 3)} ${rand(-8, -2)}`, 
                    dur: 1200,
                    easing: 'easeInOutQuad',
                    autoplay: true 
                });
            }

            el.addEventListener('animationcomplete__move', moveToRandom);

            if (scene.hasLoaded) {
                moveToRandom();
            } else {
                scene.addEventListener('loaded', moveToRandom);
            }
        }

        animateToRandomPositions('#one');
        animateToRandomPositions('#two');
        animateToRandomPositions('#three');
        animateToRandomPositions('#four');
        animateToRandomPositions('#five');
        animateToRandomPositions('#six');
        animateToRandomPositions('#sevendot');
    </script>
</body>
</html>
